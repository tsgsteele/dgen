logsPolicy:
  destination: CLOUD_LOGGING

taskGroups:
  - taskCount: "9"
    parallelism: "9"
    schedulingPolicy: AS_SOON_AS_POSSIBLE

    taskSpec:
      maxRetryCount: 3
      environment:
        variables:
          DB_USER: "postgres"
          DB_PASS: "postgres"
          DB_NAME: "dgendb"
          INSTANCE_CONNECTION_NAME: "dgen-466702:us-east1:dgen-db"
          USE_PRIVATE_IP_DIRECT: "1"
          DB_PRIVATE_IP: "10.80.160.3"
          PG_CONN_STRING: >
            host=/cloudsql/dgen-466702:us-east1:dgen-db
            port=5432
            dbname=dgendb
            user=postgres
            password=postgres
          LOCAL_CORES: "16"
          AGENT_FILE: "agent_df_base_res_national_updated_tariffs_2026.pkl"

      runnables:
      - container:
          imageUri: us-east1-docker.pkg.dev/dgen-466702/dgen-repo-east1/dgen:latest
          entrypoint: bash
          commands:
            - -lc
            - |
              #!/usr/bin/env bash
              set -euo pipefail

              source "$(conda info --base)/etc/profile.d/conda.sh"
              conda activate dg3n

              python /opt/dgen_os/python/fetch_files.py dgen-assets input_scenarios/baseline.xlsm /opt/dgen_os/input_scenarios/baseline.xlsm
              python /opt/dgen_os/python/fetch_files.py dgen-assets input_scenarios/policy.xlsm   /opt/dgen_os/input_scenarios/policy.xlsm
              python /opt/dgen_os/python/fetch_files.py dgen-assets small_states_r2a.csv /tmp/small_states_r2a.csv

              python /opt/dgen_os/python/fetch_files.py dgen-assets \
                input_agents/${AGENT_FILE} \
                /opt/dgen_os/input_agents/agent_df_base_res_national_updated_wholesale_prices.pkl

              IDX=${BATCH_TASK_INDEX}
              STATE_LINE=$(sed -n "$((IDX+1))p" /tmp/small_states_r2a.csv)
              IFS=',' read -r ABBR FULLNAME <<< "${STATE_LINE}"
              echo "[Task $IDX] Running for state=${FULLNAME} (abbr=${ABBR})"
              export BATCH_STATE="${ABBR}"
              echo "${ABBR},${FULLNAME}" > /tmp/state_${IDX}.csv

              python /opt/dgen_os/python/prepare_all_scenarios.py \
                --templates-dir /opt/dgen_os/input_scenarios \
                --output-dir    /opt/dgen_os/input_scenarios \
                --states-file   /tmp/state_${IDX}.csv \
                --end-year      2040

              rm /opt/dgen_os/input_scenarios/baseline.xlsm
              rm /opt/dgen_os/input_scenarios/policy.xlsm

              cd /opt/dgen_os/python
              python /opt/dgen_os/python/dgen_model.py

      computeResource:
        cpuMilli: 16000
        memoryMib: 32768
allocationPolicy:
  network:
    networkInterfaces:
      - network: "projects/dgen-466702/global/networks/default"
        subnetwork: "projects/dgen-466702/regions/us-east1/subnetworks/default"
